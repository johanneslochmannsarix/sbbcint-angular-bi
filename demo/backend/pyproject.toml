[project]
name = "backend"
version = "0.1.0"
description = "Demo app backend (local only): AC-1 / AC-2 / AC-8 showcases over executeQueries + a read-only Bronze reader"
requires-python = ">=3.13"
dependencies = [
    "deltalake==1.6.6",
    "fastapi==0.151.0",
    "httpx>=0.28.1",
    "pyarrow==25.0.0",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
